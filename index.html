<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="task_container">
        <form action="">
            <input type="text" placeholder="Enter Your Task : " class="inp">
            <button class="sbm_task">Submit Task</button>
        </form>


    </div>


    <h1 class="head">Your Task List</h1>

    <div class="filter-container">
        <input type="text" placeholder="Search Task " class="search">
        <div class="fill">
            <button class="filter-btn">All</button>
            <button class="filter-btn">Complated</button>
            <button class="filter-btn">Pending</button>
        </div>


    </div>
    <div class="container">

    </div>

    <script src="script.js"></script>
</body>

</html>
